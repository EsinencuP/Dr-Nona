default_provider: gemini
providers:
  gemini:
    enabled: true
    env_key: GEMINI_API_KEY
    model_env: GEMINI_IMAGE_MODEL
    default_model: gemini-2.5-flash-image
    timeout_seconds: 120
    requires_billable_approval: true
  openai:
    enabled: false
    model_env: OPENAI_IMAGE_MODEL
    default_model: gpt-image-2
    timeout_seconds: 120
  mock:
    enabled: true
    note: "Offline deterministic background plates for tests only."
  photoroom:
    enabled: false
    env_key: PHOTOROOM_API_KEY
  firefly:
    enabled: false
    env_key: ADOBE_CLIENT_ID
  stability:
    enabled: false
    env_key: STABILITY_API_KEY
